version: "3.9"

services:
  prism:
    build: .
    image: prism-deploy:latest
    ports:
      - "8000:8000"
    environment:
      - PRISM_MODELS_DIR=/app/models
    # RSF DR-Learner loads ~2 GB into RAM; allow 4 GB headroom.
    mem_limit: 4g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s   # allow time for model loading on first request
