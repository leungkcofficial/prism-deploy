version: "3.9"

services:
  prism:
    build: .
    image: prism-deploy:latest
    ports:
      - "8000:8000"
    environment:
      - PRISM_MODELS_DIR=/app/models
    # RSF DR-Learner (~3.5 GB) + other models + Python overhead = ~5.5 GB peak.
    # Requires a VPS with at least 8 GB RAM.
    # mem_limit intentionally not set: Docker cgroup memory limits are unreliable
    # inside LXC containers (Proxmox); let the host OS manage memory instead.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s   # allow time for model loading on first request
